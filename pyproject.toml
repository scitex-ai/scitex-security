[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-security"
version = "0.2.0"
description = "DEPRECATED — absorbed into scitex-audit (ADR-0001). Thin re-export shim; will be yanked from PyPI in a future release. Use scitex-audit instead."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "security", "github", "dependabot", "secret-scanning", "deprecated"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# 0.2.0 is a thin re-export shim per ADR-0001 (scitex-dev #139). All
# behaviour lives in scitex-audit ≥ 0.2.0; the hard-error CLI redirect
# uses only stdlib (no click dep needed at this layer — scitex-audit
# pulls click transitively).
dependencies = ["scitex-audit>=0.2.0"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-security[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-security"
Repository = "https://github.com/ywatanabe1989/scitex-security"
Documentation = "https://scitex-security.readthedocs.io"

[project.scripts]
scitex-security = "scitex_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.coverage.run]
parallel = true
source = ["scitex_security"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "apps", "config", "docs", "examples"]
