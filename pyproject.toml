[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-security"
version = "0.3.0"
description = "Unified security scanning for the SciTeX ecosystem: bandit + shellcheck + pip-audit + GitHub alerts (Dependabot, secret scanning, code scanning) in one orchestrator, plus a look-alike (typosquat / homograph) domain watch"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "security", "audit", "bandit", "shellcheck", "pip-audit", "github", "dependabot", "secret-scanning", "typosquatting", "homograph", "domain-monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    # `domains`: MX/NS lookups need a real DNS client; pure Python, no deps.
    "dnspython>=2.4",
    # PS-220: package diagnostics go through scitex-logging, not stdlib logging.
    "scitex-logging>=0.2.1",
]

[project.optional-dependencies]
# `domains watch --notify` mails through a scitex-notification sender
# profile; 0.3.2 adds the PASSWORD_GPG credential source.
notify = ["scitex-notification>=0.3.2"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    # tests/develop/test_audit.py imports scitex_dev.testing.audit_all_for_package
    # which transitively needs the [cli-audit] extra.
    "scitex-dev[cli-audit]>=0.11.7",
    # tests/scitex_security/domains/test__alert.py renders a real notice.
    "scitex-notification>=0.3.2",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-security[dev,docs,notify]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-security"
Repository = "https://github.com/ywatanabe1989/scitex-security"
Documentation = "https://scitex-security.readthedocs.io"

[project.scripts]
scitex-security = "scitex_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_security = ["_skills/**/*.md"]

[project.entry-points."scitex_dev.skills"]
scitex-security = "scitex_security"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.coverage.run]
parallel = true
source = ["scitex_security"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "apps", "config", "docs", "examples"]
